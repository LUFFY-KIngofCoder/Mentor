services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: mentor-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: mentor-frontend
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"

volumes:
  mentor-db-data: