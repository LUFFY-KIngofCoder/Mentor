name: CI pipeline

on:
  push:
    branches: [ "main", "phase-2-docker" ]
  pull_request:
    branches: [ "main" ]
  
jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt

      - name: Run Pytest
        env:
          DATABASE_URL: "postgresql+asyncpg://dummy:dummy@localhost:5432/dummy"
          SECRET_KEY: "dummy_secret_for_tests"
        run: |
          cd Backend
          pytest tests/ -v

  build-docker:
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build -t mentor-backend -f docker/backend/Dockerfile .
      
      - name: Build Frontend Image
        run: docker build -t mentor-frontend -f docker/frontend/Dockerfile .
