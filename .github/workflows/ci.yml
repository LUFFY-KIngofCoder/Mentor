name: CI Pipeline

# 1. When should this pipeline run?
on:
  push:
    branches: [ "main", "phase-2-docker" ]
  pull_request:
    branches: [ "main" ]

# 2. What jobs should it run?
jobs:
  # Job 1: Run our Pytest tests
  test-backend:
    runs-on: ubuntu-latest
    steps:
      # Step A: Download your code onto the GitHub server
      - name: Checkout code
        uses: actions/checkout@v4

      # Step B: Install Python 3.10
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip" # This makes future runs faster by caching packages

      # Step C: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt

      # Step D: Run the tests!
      - name: Run Pytest
        env:
          DATABASE_URL: "postgresql+asyncpg://dummy:dummy@localhost:5432/dummy"
          SECRET_KEY: "dummy_secret_for_tests"
        run: |
          cd Backend
          pytest tests/ -v

  # Job 2: Verify Docker builds successfully
  build-docker:
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # New Step: Authenticate with Docker Hub using your GitHub Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # New Step: Build and Push the Backend Image
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mentor-backend:latest,${{ secrets.DOCKERHUB_USERNAME }}/mentor-backend:${{ github.sha }}

      # New Step: Build and Push the Frontend Image
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mentor-frontend:latest,${{ secrets.DOCKERHUB_USERNAME }}/mentor-frontend:${{ github.sha }}
